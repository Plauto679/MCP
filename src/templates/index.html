<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Copy Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .terminal {
            background-color: #1a1b26;
            color: #a9b1d6;
            font-family: 'Courier New', Courier, monospace;
            height: 400px;
            overflow-y: auto;
            padding: 1rem;
            border-radius: 0.5rem;
        }
        .log-entry { margin-bottom: 2px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1b26; }
        ::-webkit-scrollbar-thumb { background: #414868; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
    <div class="max-w-6xl mx-auto space-y-8">
        <!-- Header -->
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-bold text-blue-400">Polymarket Copy Trader</h1>
            <div id="status-indicator" class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-red-500" id="status-dot"></span>
                <span id="status-text" class="font-semibold text-red-500">STOPPED</span>
            </div>
        </div>

        <!-- Controls & Stats -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Configuration Card -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 col-span-2">
                <h2 class="text-xl font-semibold mb-4 text-gray-300">Configuration</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400">Target Wallet Address</label>
                        <input type="text" id="target-wallet" value="{{ target_wallet }}" 
                            class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-400">Poll Interval (seconds)</label>
                            <input type="number" id="poll-interval" value="{{ poll_interval }}" 
                                class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="flex items-center pt-6">
                            <input type="checkbox" id="dry-run" {% if dry_run %}checked{% endif %} class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600 rounded bg-gray-700">
                            <label for="dry-run" class="ml-2 block text-sm text-gray-300">Dry Run Mode</label>
                        </div>
                    </div>
                    <div class="flex space-x-3 pt-2">
                        <button onclick="saveConfig()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
                            Update Config
                        </button>
                    </div>
                </div>
            </div>

            <!-- Actions Card -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 flex flex-col justify-center items-center space-y-4">
                <button onclick="startBot()" id="btn-start" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition text-lg shadow-lg">
                    START BOT
                </button>
                <button onclick="stopBot()" id="btn-stop" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition text-lg shadow-lg hidden">
                    STOP BOT
                </button>
            </div>
        </div>

        <!-- Terminal -->
        <div>
            <h2 class="text-xl font-semibold mb-2 text-gray-300 flex justify-between">
                <span>Live Logs</span>
                <span class="text-xs text-gray-500 font-mono self-end">Connected via WebSocket</span>
            </h2>
            <div id="terminal" class="terminal font-mono text-sm">
                <div class="log-entry text-gray-500">Waiting for logs...</div>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws/logs`);
        const terminal = document.getElementById('terminal');
        let isRunning = {{ 'true' if running else 'false' }};

        function updateUI(running) {
            isRunning = running;
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const btnStart = document.getElementById('btn-start');
            const btnStop = document.getElementById('btn-stop');

            if (running) {
                statusDot.className = "w-3 h-3 rounded-full bg-green-500 animate-pulse";
                statusText.className = "font-semibold text-green-500";
                statusText.innerText = "RUNNING";
                btnStart.classList.add('hidden');
                btnStop.classList.remove('hidden');
            } else {
                statusDot.className = "w-3 h-3 rounded-full bg-red-500";
                statusText.className = "font-semibold text-red-500";
                statusText.innerText = "STOPPED";
                btnStart.classList.remove('hidden');
                btnStop.classList.add('hidden');
            }
        }

        // Initialize UI status
        updateUI(isRunning);

        ws.onmessage = function(event) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.textContent = `> ${event.data}`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        };

        async function saveConfig() {
            const config = {
                target_wallet: document.getElementById('target-wallet').value,
                dry_run: document.getElementById('dry-run').checked,
                poll_interval: parseInt(document.getElementById('poll-interval').value)
            };
            
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(config)
                });
                if(res.ok) alert('Configuration Saved!');
            } catch(e) {
                alert('Error saving config');
            }
        }

        async function startBot() {
            const res = await fetch('/api/start', { method: 'POST' });
            if (res.ok) updateUI(true);
        }

        async function stopBot() {
            const res = await fetch('/api/stop', { method: 'POST' });
            if (res.ok) updateUI(false);
        }
    </script>
</body>
</html>
