<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Copy Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .terminal {
            background-color: #1a1b26;
            color: #a9b1d6;
            font-family: 'Courier New', Courier, monospace;
            height: 400px;
            overflow-y: auto;
            padding: 1rem;
            border-radius: 0.5rem;
        }

        .log-entry {
            margin-bottom: 2px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1b26;
        }

        ::-webkit-scrollbar-thumb {
            background: #414868;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-gray-900 text-white min-h-screen p-8">
    <div class="max-w-7xl mx-auto flex space-x-6">

        <!-- Sidebar: Strategy History -->
        <div class="w-1/4 bg-gray-800 p-4 rounded-lg border border-gray-700 h-[calc(100vh-4rem)] flex flex-col">
            <h2 class="text-lg font-bold mb-4 text-gray-300 border-b border-gray-700 pb-2">📜 Strategy History</h2>
            <div id="history-list" class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                <div class="text-gray-500 text-sm italic text-center mt-10">No history yet...</div>
            </div>
            <div class="mt-4 pt-4 border-t border-gray-700">
                <button onclick="loadHistory()"
                    class="text-xs text-blue-400 hover:text-blue-300 w-full text-center">Refresh History</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="w-3/4 space-y-6 overflow-y-auto h-[calc(100vh-4rem)] pr-2 custom-scrollbar">
            <!-- Header -->
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold text-blue-400">Polymarket Copy Trader</h1>
                <div id="status-indicator" class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-red-500" id="status-dot"></span>
                    <span id="status-text" class="font-semibold text-red-500">STOPPED</span>
                </div>
            </div>

            <!-- Controls & Stats -->
            <div class="grid grid-cols-1 gap-6">
                <!-- Configuration Card -->
                <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                    <h2 class="text-xl font-semibold mb-4 text-gray-300">Configuration</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-400">Target Wallet Address</label>
                            <input type="text" id="target-wallet" value="{{ target_wallet }}"
                                class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 font-mono text-sm">
                        </div>

                        <!-- Bet Size Strategy -->
                        <div class="bg-gray-750 p-4 rounded border border-gray-600">
                            <h3 class="text-sm font-medium text-gray-300 mb-2">Bet Size Strategy</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-gray-500 uppercase">Strategy Mode</label>
                                    <select id="size-mode" onchange="updateSizeLabel()"
                                        class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-blue-500">
                                        <option value="fixed" {% if size_mode=='fixed' %}selected{% endif %}>Fixed
                                            Amount
                                        </option>
                                        <option value="percentage" {% if size_mode=='percentage' %}selected{% endif %}>
                                            Percentage Multiplier</option>
                                    </select>
                                </div>
                                <div>
                                    <label id="size-value-label" class="block text-xs text-gray-500 uppercase">Amount
                                        (USDC)</label>
                                    <input type="number" step="0.01" id="size-value" value="{{ size_value }}"
                                        class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-blue-500">
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-400">Poll Interval (seconds)</label>
                                <input type="number" id="poll-interval" value="{{ poll_interval }}"
                                    class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div class="flex items-center pt-6">
                                <input type="checkbox" id="dry-run" {% if dry_run %}checked{% endif %}
                                    class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600 rounded bg-gray-700">
                                <label for="dry-run" class="ml-2 block text-sm text-gray-300">Dry Run Mode</label>
                            </div>
                        </div>
                        </div>
                        
                        <!-- Timer Settings -->
                        <div class="mt-4 pt-4 border-t border-gray-700">
                             <label class="block text-sm font-medium text-gray-400">Run Duration (Minutes)</label>
                             <div class="text-xs text-gray-500 mb-1">Leave empty or 0 to run indefinitely</div>
                             <input type="number" id="run-duration" placeholder="e.g. 60"
                                    class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 font-mono text-sm">
                        </div>

                        <div class="flex space-x-3 pt-4">
                            <button onclick="saveConfig()"
                                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition w-full md:w-auto">
                                Save & Update Config
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Actions Card -->
                <div
                    class="bg-gray-800 p-6 rounded-lg border border-gray-700 flex flex-col justify-center items-center space-y-4">
                    <button onclick="startBot()" id="btn-start"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition text-lg shadow-lg">
                        START BOT
                    </button>
                    <button onclick="stopBot()" id="btn-stop"
                        class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition text-lg shadow-lg hidden">
                        STOP BOT
                    </button>
                </div>
            </div>

            <!-- Terminal -->
            <div>
                <h2 class="text-xl font-semibold mb-2 text-gray-300 flex justify-between">
                    <span>Live Logs</span>
                    <span class="text-xs text-gray-500 font-mono self-end">Connected via WebSocket</span>
                </h2>
                <div id="terminal" class="terminal font-mono text-sm h-64">
                    <div class="log-entry text-gray-500">Waiting for logs...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws/logs`);
        const terminal = document.getElementById('terminal');
        let isRunning = {{ 'true' if running else 'false' }};
        let historyData = [];

        function updateUI(running) {
            isRunning = running;
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const btnStart = document.getElementById('btn-start');
            const btnStop = document.getElementById('btn-stop');

            if (running) {
                statusDot.className = "w-3 h-3 rounded-full bg-green-500 animate-pulse";
                statusText.className = "font-semibold text-green-500";
                statusText.innerText = "RUNNING";
                btnStart.classList.add('hidden');
                btnStop.classList.remove('hidden');
            } else {
                statusDot.className = "w-3 h-3 rounded-full bg-red-500";
                statusText.className = "font-semibold text-red-500";
                statusText.innerText = "STOPPED";
                btnStart.classList.remove('hidden');
                btnStop.classList.add('hidden');
            }
        }

        // Initialize UI status
        updateUI(isRunning);
        updateSizeLabel(); // Set correct label on load
        loadHistory(); // Load history on start

        function updateSizeLabel() {
            const mode = document.getElementById('size-mode').value;
            const label = document.getElementById('size-value-label');
            if (mode === 'fixed') {
                label.innerText = 'Amount (USDC)';
            } else {
                label.innerText = 'Multiplier (1.0 = 100%)';
            }
        }

        ws.onmessage = function (event) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.textContent = `> ${event.data}`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        };

        async function saveConfig() {
            const config = {
                target_wallet: document.getElementById('target-wallet').value,
                dry_run: document.getElementById('dry-run').checked,
                poll_interval: parseInt(document.getElementById('poll-interval').value),
                size_mode: document.getElementById('size-mode').value,
                size_value: parseFloat(document.getElementById('size-value').value)
            };

            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                if (res.ok) {
                    // alert('Configuration Saved!');
                    loadHistory(); // Refresh history sidebar immediately
                }
            } catch (e) {
                alert('Error saving config');
            }
        }

        async function startBot() {
            const durationInput = document.getElementById('run-duration').value;
            const duration = durationInput ? parseInt(durationInput) : null;
            
            const res = await fetch('/api/start', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ duration: duration }) 
            });
            if (res.ok) updateUI(true);
        }

        async function stopBot() {
            const res = await fetch('/api/stop', { method: 'POST' });
            if (res.ok) updateUI(false);
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                historyData = data.history;
                renderHistory();
            } catch (e) {
                console.error("Failed to load history", e);
            }
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';
            
            if (historyData.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-sm italic text-center mt-10">No history yet...</div>';
                return;
            }

            historyData.forEach((item, index) => {
                const date = new Date(item.timestamp).toLocaleString(undefined, {
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                
                const div = document.createElement('div');
                div.className = "bg-gray-750 p-3 rounded cursor-pointer hover:bg-gray-700 border border-gray-600 transition group";
                div.onclick = () => restoreConfig(index);
                
                // Truncate wallet for display
                const walletShort = item.target_wallet.substring(0, 6) + '...' + item.target_wallet.substring(item.target_wallet.length - 4);
                
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-xs text-blue-400 font-mono font-bold">${walletShort}</span>
                        <span class="text-[10px] text-gray-500">${date}</span>
                    </div>
                    <div class="text-xs text-gray-300">
                        <span class="font-semibold text-gray-400">${item.size_mode === 'fixed' ? 'Fix' : 'Pct'}:</span> 
                        ${item.size_value} ${item.size_mode === 'fixed' ? '$' : 'x'}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function restoreConfig(index) {
            const item = historyData[index];
            if (!item) return;
            
            if(!confirm("Restore this configuration?")) return;

            document.getElementById('target-wallet').value = item.target_wallet;
            document.getElementById('dry-run').checked = item.dry_run;
            document.getElementById('poll-interval').value = item.poll_interval;
            document.getElementById('size-mode').value = item.size_mode;
            document.getElementById('size-value').value = item.size_value;
            
            updateSizeLabel();
            // Optional: Auto-save on restore? Or let user click save? 
            // Let's auto-save to apply it to the backend immediately.
            saveConfig();
        }
    </script>
</body>

</html>
